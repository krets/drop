<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>drop</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070f; overflow: hidden; touch-action: none; user-select: none; }
  body { display: grid; place-items: center; }
  canvas {
    height: 100vh; max-width: 100vw; aspect-ratio: 360 / 600; background: #0b0b1a;
    image-rendering: pixelated; box-shadow: 0 0 40px #4b2bff55;
  }
</style>
<canvas id="c" width="360" height="600"></canvas>
<script>
(() => {
  const W = 360, H = 600, R = 10, PH = 14, SPACING = 120;
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  const FONT = (n) => `bold ${n}px "Courier New", monospace`;
  let best = 0;
  try { best = +localStorage.getItem("drop-best") || 0; } catch {}

  let state = "title", ball, plats, speed, passed, nextY, hue, keys = {}, touch = 0, last = 0, t = 0, overAt = 0;

  function reset() {
    ball = { x: W / 2, y: 120, vy: 0, px: 0, py: 0 };
    plats = []; speed = 60; passed = 0; hue = 0; nextY = 300;
    while (nextY < H + SPACING) spawn();
  }

  function spawn() {
    const gapW = Math.max(62, 110 - passed * 0.8);
    const gapX = 12 + Math.random() * (W - gapW - 24);
    plats.push({ y: nextY, gapX, gapW, hue: (hue += 37) % 360, done: false, prevY: nextY });
    nextY += SPACING;
  }

  function start() { reset(); state = "play"; }

  function die() {
    state = "over"; overAt = performance.now();
    if (passed > best) { best = passed; try { localStorage.setItem("drop-best", best); } catch {} }
  }

  function step(dt) {
    const dir = (keys.ArrowRight || keys.d || touch > 0 ? 1 : 0) - (keys.ArrowLeft || keys.a || touch < 0 ? 1 : 0);
    speed = Math.min(340, speed + 4 * dt);
    const scroll = speed * dt;

    ball.px = ball.x; ball.py = ball.y;
    const prevBottom = ball.y + R;

    for (const p of plats) { p.prevY = p.y; p.y -= scroll; }
    nextY -= scroll;
    while (plats.length && plats[0].y + PH < 0) plats.shift();
    while (nextY < H + SPACING) spawn();

    ball.x = Math.max(R, Math.min(W - R, ball.x + dir * 230 * dt));
    ball.vy += 900 * dt;
    ball.y += ball.vy * dt;

    if (ball.y + R > H) { ball.y = H - R; ball.vy = 0; } // floor first, so a rising platform can still lift the ball
    for (const p of plats) {
      const top = p.y, bot = p.y + PH;
      if (ball.y + R <= top || ball.y - R >= bot) continue;
      const inGap = ball.x - R >= p.gapX && ball.x + R <= p.gapX + p.gapW;
      const wasAbove = prevBottom <= p.prevY + 0.5;
      if (wasAbove && !inGap) { ball.y = top - R; ball.vy = 0; }
      else if (!inGap) ball.x = Math.max(p.gapX + R, Math.min(p.gapX + p.gapW - R, ball.x));
    }

    for (const p of plats) if (!p.done && p.y + PH < ball.y - R) { p.done = true; passed++; }
    if (ball.y - R <= 0) die();
  }

  function glow(c, blur) { g.shadowColor = c; g.shadowBlur = blur; g.fillStyle = c; }

  function draw() {
    g.clearRect(0, 0, W, H);
    g.fillStyle = "#0b0b1a"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "#1a1a38"; g.lineWidth = 1;
    const off = (t * speed * 0.3) % 30;
    for (let y = -off; y < H; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

    if (state !== "title") {
      for (const p of plats) {
        glow(`hsl(${p.hue} 100% 60%)`, 10);
        g.fillRect(0, p.y, p.gapX, PH);
        g.fillRect(p.gapX + p.gapW, p.y, W - p.gapX - p.gapW, PH);
      }
      glow("#ffe14d", 16);
      g.beginPath(); g.arc(ball.x, ball.y, R, 0, 7); g.fill();

      g.shadowBlur = 0;
      g.fillStyle = "#ff3b5c"; g.fillRect(0, 0, W, 3);
      g.fillStyle = "#fff"; g.font = FONT(22); g.textAlign = "left";
      g.fillText(String(passed).padStart(4, "0"), 10, 30);
      g.textAlign = "right"; g.fillStyle = "#8a8ab0"; g.font = FONT(14);
      g.fillText("BEST " + String(best).padStart(4, "0"), W - 10, 28);
    }

    g.textAlign = "center"; g.shadowBlur = 0;
    if (state === "title") {
      glow("#00e5ff", 20); g.font = FONT(64); g.fillText("DROP", W / 2, 240);
      g.shadowBlur = 0; g.fillStyle = "#c8c8e8"; g.font = FONT(14);
      g.fillText("FIND THE GAP. DON'T HIT THE TOP.", W / 2, 285);
      g.fillText("← →  /  TAP SIDES", W / 2, 310);
      if (Math.floor(t * 2) % 2) { g.fillStyle = "#ffe14d"; g.font = FONT(18); g.fillText("PRESS ANY KEY", W / 2, 380); }
    } else if (state === "over") {
      g.fillStyle = "#000a"; g.fillRect(0, 0, W, H);
      glow("#ff3b5c", 20); g.font = FONT(44); g.fillText("GAME OVER", W / 2, 260);
      g.shadowBlur = 0; g.fillStyle = "#fff"; g.font = FONT(20);
      g.fillText("SCORE " + passed, W / 2, 305);
      g.fillStyle = "#8a8ab0"; g.font = FONT(14); g.fillText("BEST " + best, W / 2, 330);
      if (Math.floor(t * 2) % 2) { g.fillStyle = "#ffe14d"; g.font = FONT(18); g.fillText("PRESS ANY KEY", W / 2, 390); }
    }

    // scanlines
    g.fillStyle = "#0000002e";
    for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  }

  function frame(ts) {
    const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts; t += dt;
    if (state === "play") step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  const poke = () => {
    if (state === "title") start();
    else if (state === "over" && performance.now() - overAt > 600) start();
  };
  addEventListener("keydown", e => {
    if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
    keys[e.key] = true; poke();
  });
  addEventListener("keyup", e => { keys[e.key] = false; });
  const side = e => { const r = cv.getBoundingClientRect(); touch = e.clientX < r.left + r.width / 2 ? -1 : 1; };
  cv.addEventListener("pointerdown", e => { side(e); poke(); });
  cv.addEventListener("pointermove", e => { if (touch) side(e); });
  addEventListener("pointerup", () => { touch = 0; });
  addEventListener("pointercancel", () => { touch = 0; });

  reset();
  requestAnimationFrame(frame);
})();
</script>
