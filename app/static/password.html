<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password required</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 24rem; margin: 4rem auto; padding: 0 1rem; }
    input, button { padding: .5rem; width: 100%; box-sizing: border-box; margin-top: .5rem; }
    #err { color: var(--danger); min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Password required</h1>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button>Continue</button>
    <p id="err" role="alert"></p>
  </form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch(location.pathname + '/unlock', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('pw').value }),
  });
  if (r.ok) return location.reload();
  document.getElementById('err').textContent =
    r.status === 401 ? 'Wrong password.' : r.status === 429 ? 'Too many attempts. Try again later.' : 'This link is not available.';
};
</script>
</body>
</html>
