services:
  backend:
    build:
      context: ./app
      target: runtime
    container_name: dropbox_backend
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    volumes:
      - ./data:/data # SQLite database
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.dropbox.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.dropbox.entrypoints=websecure
      - traefik.http.routers.dropbox.tls=true
      - traefik.http.services.dropbox.loadbalancer.server.port=8000
      # Admin UI and Google login are only reachable from the allowlisted IPs
      - traefik.http.routers.dropbox-admin.rule=Host(`${DOMAIN}`) && (PathPrefix(`/admin`) || PathPrefix(`/auth`))
      - traefik.http.routers.dropbox-admin.entrypoints=websecure
      - traefik.http.routers.dropbox-admin.tls=true
      - traefik.http.routers.dropbox-admin.priority=100
      - traefik.http.routers.dropbox-admin.middlewares=dropbox-admin-ip
      - traefik.http.middlewares.dropbox-admin-ip.ipallowlist.sourcerange=91.65.243.119/32,127.0.0.1/32,::1/128

  test:
    profiles: [test]
    build:
      context: ./app
      target: test

networks:
  proxy:
    external: true
